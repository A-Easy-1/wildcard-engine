<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rex "The Wildcard" Harper Engine — Estero Cup</title>
  <style>
    :root {
      --bg-color: #12181b;
      --card-bg: #1e272c;
      --accent-green: #2ecc71;
      --accent-gold: #f1c40f;
      --accent-red: #e74c3c;
      --text-main: #f5f6fa;
      --text-muted: #a4b0be;
      --border-color: #2c3e50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent-gold);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--accent-green);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(46, 204, 113, 0.2);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    select, input, button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #151c20;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    button {
      background: var(--accent-green);
      color: #12181b;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 0.5rem;
    }

    button:hover {
      background: #27ae60;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      font-size: 0.8rem;
      padding: 0.5rem;
    }

    .btn-spin {
      background: #2c3e50;
      color: var(--accent-gold);
      font-size: 0.8rem;
      padding: 0.4rem 0.6rem;
      margin-top: 0.5rem;
      border: 1px solid var(--border-color);
    }

    .btn-spin:hover {
      background: #34495e;
    }

    .spin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .spin-box {
      background: #151c20;
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .spin-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .spin-value {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-gold);
      min-height: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .results-panel {
      background: #151c20;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      border-left: 4px solid var(--accent-gold);
    }

    .results-tier {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
    }

    .narrative-text {
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .scorecard-container {
      overflow-x: auto;
      margin-top: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: center;
    }

    th, td {
      padding: 6px 4px;
      border: 1px solid var(--border-color);
    }

    th {
      background: #151c20;
      color: var(--text-muted);
    }

    .stroke-dot {
      color: var(--accent-gold);
      font-weight: bold;
    }

    .highlight-magic {
      background: rgba(46, 204, 113, 0.25);
      color: var(--accent-green);
      font-weight: bold;
    }

    .highlight-blowup {
      background: rgba(231, 76, 60, 0.25);
      color: var(--accent-red);
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .persisted-banner {
      font-size: 0.75rem;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <h1>⛳️ The Estero Cup</h1>
    <div class="subtitle">Rex "The Wildcard" Harper Performance Engine</div>
  </header>

  <!-- STEP 1: PRE-ROUND PERFORMANCE ENGINE -->
  <div class="card">
    <h2>
      1. Pre-Round Factors
      <span id="spinStatus" class="status-badge">Spin All 3 Factors</span>
    </h2>

    <div class="form-group">
      <label for="courseSelect">Select Course layout:</label>
      <select id="courseSelect" onchange="updateCourseSelection()">
        <option value="hammock">Hammock Bay (HC Limit: 10)</option>
        <option value="rookery">The Rookery (HC Limit: 10)</option>
        <option value="thepark">The Park (HC Limit: 10)</option>
        <option value="saltleaf">Saltleaf Preserve (HC Limit: 10)</option>
        <option value="tiburon">Tiburón Black (HC Limit: 10)</option>
      </select>
    </div>

    <!-- 3 SEPARATE SPIN BUTTON COMPONENT GRID -->
    <div class="spin-grid">
      <div class="spin-box">
        <div class="spin-label">Rest</div>
        <div id="valRest" class="spin-value">-</div>
        <button id="btnRest" class="btn-spin" onclick="spinIndividual('rest')">🎲 Spin</button>
      </div>
      <div class="spin-box">
        <div class="spin-label">Vibes</div>
        <div id="valVibes" class="spin-value">-</div>
        <button id="btnVibes" class="btn-spin" onclick="spinIndividual('vibes')">🎲 Spin</button>
      </div>
      <div class="spin-box">
        <div class="spin-label">Beverages</div>
        <div id="valDrinks" class="spin-value">-</div>
        <button id="btnDrinks" class="btn-spin" onclick="spinIndividual('drinks')">🎲 Spin</button>
      </div>
    </div>

    <button id="calcBtn" onclick="evaluateRexPerformance()" disabled style="opacity: 0.5; cursor: not-allowed;">⚡️ Calculate Rex's Outlook</button>

    <div id="resultPanel" class="results-panel hidden">
      <div id="persistedNotice" class="persisted-banner hidden">
        <span>⚡️ Active Session Restored</span>
        <button class="btn-secondary" style="width: auto; padding: 2px 6px;" onclick="clearSavedSession()">Reset</button>
      </div>
      <div id="resTier" class="results-tier"></div>
      <div id="resNarrative" class="narrative-text"></div>
      <div id="resTargetGross" style="font-size:0.85rem; color: var(--accent-green); margin-top: 0.25rem;"></div>
    </div>
  </div>

  <!-- STEP 2: SCORECARD GENERATOR -->
  <div class="card">
    <h2>2. Scorecard Generator</h2>

    <div class="form-group">
      <label for="actualNetScore">Rex's Target Net Score for Round:</label>
      <input type="number" id="actualNetScore" placeholder="e.g. 72" min="60" max="110" />
    </div>

    <button onclick="generateScorecard()">📝 Generate Official Scorecard</button>

    <div id="scorecardOutput" class="scorecard-container hidden">
      <table id="scorecardTable">
        <thead>
          <tr id="holeHeader"><th>Hole</th></tr>
          <tr id="parHeader"><th>Par</th></tr>
          <tr id="hdcpHeader"><th>Hdcp</th></tr>
        </thead>
        <tbody>
          <tr id="grossRow"><td>Gross</td></tr>
          <tr id="netRow"><td>Net</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const COURSES = {
      hammock: { name: "Hammock Bay", pars: [4,4,3,5,4,4,3,4,5, 4,3,5,4,4,3,4,4,5], hdcps: [7,3,15,1,11,5,17,9,13, 8,16,2,10,6,18,12,4,14] },
      rookery: { name: "The Rookery", pars: [4,5,4,3,4,4,5,3,4, 4,4,3,5,4,3,4,4,5], hdcps: [5,11,1,15,7,3,13,17,9, 6,10,18,2,8,16,12,4,14] },
      thepark: { name: "The Park", pars: [4,4,3,5,4,3,4,5,4, 4,3,4,4,5,3,4,4,5], hdcps: [9,3,15,1,7,17,11,5,13, 8,16,6,10,2,18,12,4,14] },
      saltleaf: { name: "Saltleaf Preserve", pars: [4,3,5,4,4,3,5,4,4, 4,4,3,5,4,3,4,4,5], hdcps: [5,17,1,9,11,15,3,7,13, 6,10,18,2,8,16,12,4,14] },
      tiburon: { name: "Tiburón Black", pars: [4,4,5,3,4,4,3,5,4, 4,3,5,4,4,3,4,4,5], hdcps: [7,3,1,15,9,5,17,11,13, 8,16,2,10,6,18,12,4,14] }
    };

    const ALL_TIERS = [
      { rank: 1, title: "Rank #1 — Jackpot (Pure Vision)", desc: "Rex is locked in. Blade putter working with lethal precision." },
      { rank: 2, title: "Rank #2 — Flawless Tempo", desc: "Solid ball striking, driving lines are clean and controlled." },
      { rank: 3, title: "Rank #3 — Solid Contender", desc: "Classic 10-handicap performance baseline with steady scoring." },
      { rank: 4, title: "Rank #4 — Wildcard Baseline", desc: "Inconsistent tee shots balanced out by clutch scrambling." },
      { rank: 5, title: "Rank #5 — Short Game Scramble", desc: "Driver acting up; relies heavily on wedges and putter to save par." },
      { rank: 6, title: "Rank #6 — High Variance Chaos", desc: "A wild ride of birdies mixed with double bogeys." },
      { rank: 7, title: "Rank #7 — Two-Way Miss Takeover", desc: "Driver is unruly. Heavy reliance on short game to survive." }
    ];

    const STORAGE_KEY = 'estero_cup_rex_session';

    let factorValues = {
      rest: null,
      vibes: null,
      drinks: null
    };

    let currentRexState = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadSavedSession();
    });

    function spinIndividual(type) {
      const valElem = document.getElementById(type === 'rest' ? 'valRest' : type === 'vibes' ? 'valVibes' : 'valDrinks');
      
      let ticks = 0;
      const interval = setInterval(() => {
        valElem.innerText = Math.floor(Math.random() * 10) + 1;
        ticks++;
        if (ticks > 10) {
          clearInterval(interval);
          const finalVal = Math.floor(Math.random() * 10) + 1;
          valElem.innerText = finalVal;
          factorValues[type] = finalVal;
          checkAllSpun();
        }
      }, 50);
    }

    function checkAllSpun() {
      const calcBtn = document.getElementById('calcBtn');
      const statusBadge = document.getElementById('spinStatus');

      if (factorValues.rest !== null && factorValues.vibes !== null && factorValues.drinks !== null) {
        calcBtn.disabled = false;
        calcBtn.style.opacity = '1';
        calcBtn.style.cursor = 'pointer';
        statusBadge.innerText = 'Ready to Calculate';
        statusBadge.style.color = 'var(--accent-gold)';
      } else {
        const remaining = 3 - [factorValues.rest, factorValues.vibes, factorValues.drinks].filter(v => v !== null).length;
        statusBadge.innerText = `Spin ${remaining} More`;
      }
    }

    function evaluateRexPerformance() {
      const { rest, vibes, drinks } = factorValues;
      
      // Scaled formula covering all 7 ranks evenly
      const rawScore = (rest * 1.5) + (vibes * 1.2) - (drinks * 1.0) + (Math.random() * 4 - 2);
      
      // Index mapped 0 (Rank 1) to 6 (Rank 7)
      let tierIndex = 6 - Math.min(6, Math.max(0, Math.floor((rawScore + 5) / 4)));
      const selectedTier = ALL_TIERS[tierIndex];

      const magicHole = (selectedTier.rank <= 4) ? Math.floor(Math.random() * 18) + 1 : null;
      const blowupHole = (selectedTier.rank >= 3) ? Math.floor(Math.random() * 18) + 1 : null;

      let narrative = selectedTier.desc;
      if (magicHole) narrative += ` Magic moment expected on Hole #${magicHole}.`;
      if (blowupHole) narrative += ` Blowup risk on Hole #${blowupHole}.`;

      currentRexState = {
        timestamp: Date.now(),
        courseKey: document.getElementById('courseSelect').value,
        rest, vibes, drinks,
        tier: selectedTier.title,
        magicHole, blowupHole,
        desc: narrative
      };

      saveSession(currentRexState);
      renderRexUI(currentRexState, false);
    }

    function updateCourseSelection() {
      if (currentRexState) {
        currentRexState.courseKey = document.getElementById('courseSelect').value;
        saveSession(currentRexState);
      }
    }

    function saveSession(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error("Failed to save session:", e);
      }
    }

    function loadSavedSession() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;

        const state = JSON.parse(raw);
        if (Date.now() - state.timestamp > 18 * 60 * 60 * 1000) {
          clearSavedSession();
          return;
        }

        currentRexState = state;
        factorValues = { rest: state.rest, vibes: state.vibes, drinks: state.drinks };

        document.getElementById('courseSelect').value = state.courseKey;
        document.getElementById('valRest').innerText = state.rest;
        document.getElementById('valVibes').innerText = state.vibes;
        document.getElementById('valDrinks').innerText = state.drinks;

        checkAllSpun();
        renderRexUI(state, true);
      } catch (e) {
        console.error("Failed to load session:", e);
      }
    }

    function clearSavedSession() {
      localStorage.removeItem(STORAGE_KEY);
      currentRexState = null;
      factorValues = { rest: null, vibes: null, drinks: null };

      document.getElementById('valRest').innerText = '-';
      document.getElementById('valVibes').innerText = '-';
      document.getElementById('valDrinks').innerText = '-';
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('scorecardOutput').classList.add('hidden');
      
      const calcBtn = document.getElementById('calcBtn');
      calcBtn.disabled = true;
      calcBtn.style.opacity = '0.5';
      calcBtn.style.cursor = 'not-allowed';

      const statusBadge = document.getElementById('spinStatus');
      statusBadge.innerText = 'Spin All 3 Factors';
      statusBadge.style.color = 'var(--accent-green)';
    }

    function renderRexUI(state, isRestored) {
      document.getElementById('resTier').innerText = state.tier;
      document.getElementById('resNarrative').innerText = state.desc;
      document.getElementById('resultPanel').classList.remove('hidden');

      const statusBadge = document.getElementById('spinStatus');
      statusBadge.innerText = 'Active Session';
      statusBadge.style.color = 'var(--accent-gold)';

      if (isRestored) {
        document.getElementById('persistedNotice').classList.remove('hidden');
      } else {
        document.getElementById('persistedNotice').classList.add('hidden');
      }
    }

    function generateScorecard() {
      if (!currentRexState) {
        alert("Please calculate Rex's outlook first!");
        return;
      }

      const targetNet = parseInt(document.getElementById('actualNetScore').value);
      if (isNaN(targetNet)) {
        alert("Enter a valid target net score.");
        return;
      }

      const course = COURSES[currentRexState.courseKey || 'hammock'];
      const rexCourseHdcp = 10; 
      const targetGross = targetNet + rexCourseHdcp;

      let grossScores = [...course.pars];
      let currentSum = grossScores.reduce((a, b) => a + b, 0);
      let diff = targetGross - currentSum;

      if (currentRexState.magicHole) {
        const idx = currentRexState.magicHole - 1;
        grossScores[idx] -= 1;
        diff += 1;
      }

      if (currentRexState.blowupHole) {
        const idx = currentRexState.blowupHole - 1;
        grossScores[idx] += 2;
        diff -= 2;
      }

      let holeOrder = course.hdcps.map((hdcp, idx) => ({ hdcp, idx })).sort((a, b) => a.hdcp - b.hdcp);
      let ptr = 0;
      while (diff !== 0 && ptr < 100) {
        let targetIdx = holeOrder[ptr % 18].idx;
        if (diff > 0) {
          grossScores[targetIdx] += 1;
          diff--;
        } else {
          grossScores[targetIdx] -= 1;
          diff++;
        }
        ptr++;
      }

      renderTableUI(course, grossScores, rexCourseHdcp, currentRexState);
    }

    function renderTableUI(course, grossScores, hdcpLimit, state) {
      const holeHeader = document.getElementById('holeHeader');
      const parHeader = document.getElementById('parHeader');
      const hdcpHeader = document.getElementById('hdcpHeader');
      const grossRow = document.getElementById('grossRow');
      const netRow = document.getElementById('netRow');

      holeHeader.innerHTML = '<th>Hole</th>';
      parHeader.innerHTML = '<th>Par</th>';
      hdcpHeader.innerHTML = '<th>Hdcp</th>';
      grossRow.innerHTML = '<td>Gross</td>';
      netRow.innerHTML = '<td>Net</td>';

      for (let i = 0; i < 18; i++) {
        const hNum = i + 1;
        const par = course.pars[i];
        const hdcp = course.hdcps[i];
        const gross = grossScores[i];
        const getsStroke = hdcp <= hdcpLimit;
        const net = getsStroke ? gross - 1 : gross;

        let cellClass = "";
        if (hNum === state.magicHole) cellClass = "highlight-magic";
        if (hNum === state.blowupHole) cellClass = "highlight-blowup";

        holeHeader.innerHTML += `<th>${hNum}</th>`;
        parHeader.innerHTML += `<td>${par}</td>`;
        hdcpHeader.innerHTML += `<td>${hdcp}${getsStroke ? '<span class="stroke-dot">•</span>' : ''}</td>`;
        grossRow.innerHTML += `<td class="${cellClass}">${gross}</td>`;
        netRow.innerHTML += `<td class="${cellClass}">${net}</td>`;
      }

      document.getElementById('scorecardOutput').classList.remove('hidden');
    }
  </script>
</body>
</html>
